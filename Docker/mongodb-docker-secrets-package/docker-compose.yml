services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: Admin
      MONGO_INITDB_ROOT_PASSWORD: VerySecureMongoPassword123
      MONGO_INITDB_DATABASE: appdb

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: Admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: VerySecureMongoPassword123
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: MongoExpressSecurePassword123

    depends_on:
      - mongodb

volumes:
  mongo_data:
